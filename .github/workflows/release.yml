name: Release

on:
  push:
    branches:
      - master
    tags:
      - "*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.201"

      - name: Restore application
        run: dotnet restore ./Voicemeeter/Voicemeeter.csproj

      - name: Restore self-tests
        run: dotnet restore ./Voicemeeter.Tests/Voicemeeter.Tests.csproj

      - name: Build application
        run: dotnet build ./Voicemeeter/Voicemeeter.csproj -c Release --no-restore

      - name: Build self-tests
        run: dotnet build ./Voicemeeter.Tests/Voicemeeter.Tests.csproj -c Release --no-restore

      - name: Run self-tests
        run: dotnet run --project ./Voicemeeter.Tests/Voicemeeter.Tests.csproj -c Release --no-restore --no-build

      - name: Restore win-x64 publish target
        run: >-
          dotnet restore ./Voicemeeter/Voicemeeter.csproj -r win-x64
          -p:SelfContained=false -p:PublishSelfContained=false
          -p:PublishSingleFile=true -p:PublishTrimmed=false -p:PublishReadyToRun=false

      - name: Publish Release
        run: >-
          dotnet publish ./Voicemeeter/Voicemeeter.csproj -c Release -r win-x64
          --no-self-contained -p:PublishSelfContained=false
          -p:PublishSingleFile=true -p:PublishTrimmed=false -p:PublishReadyToRun=false
          -p:DebugType=None -p:DebugSymbols=false --no-restore
          -o ./artifacts/win-x64

      - name: Verify release size and runtime requirements
        shell: pwsh
        run: |
          $exe = Get-Item ./artifacts/win-x64/Voicemeeter.exe -ErrorAction Stop
          if ($exe.Length -gt 5MB) {
            throw "Release exceeds 5 MiB; check for bundled runtimes or unnecessary dependencies."
          }
          $files = @(Get-ChildItem ./artifacts/win-x64 -Recurse -File)
          if ($files.Count -ne 1) {
            throw "Expected a single Voicemeeter.exe release artifact."
          }
          $config = Get-Content ./Voicemeeter/bin/Release/net10.0-windows/win-x64/Voicemeeter.runtimeconfig.json -Raw | ConvertFrom-Json
          $options = $config.runtimeOptions
          $frameworks = @(@($options.framework) + @($options.frameworks) | Where-Object { $null -ne $_ })
          if ($options.includedFrameworks -or $frameworks.Count -ne 1 -or $frameworks[0].name -ne 'Microsoft.NETCore.App') {
            throw "Expected an external .NET runtime, with no bundled runtime or Windows Desktop dependency."
          }
          Write-Host ("Release size: {0:N2} MiB" -f ($exe.Length / 1MB))

      - name: Smoke test published executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path ./artifacts/win-x64/Voicemeeter.exe).Path
          $stdout = Join-Path $env:GITHUB_WORKSPACE 'artifacts/smoke.stdout.log'
          $stderr = Join-Path $env:GITHUB_WORKSPACE 'artifacts/smoke.stderr.log'
          $process = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            Start-Sleep -Seconds 3
            $process.Refresh()
            if ($process.HasExited) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "Published executable exited unexpectedly with code $($process.ExitCode)."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
            }
            $process.Dispose()
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoicemeeterMQTT-win-x64
          path: artifacts/win-x64/Voicemeeter.exe
          if-no-files-found: error

      - name: Create Release
        if: contains(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/win-x64/Voicemeeter.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
