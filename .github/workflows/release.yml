name: Release

on:
  push:
    branches:
      - master
    tags:
      - "*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.201"

      - name: Restore application
        run: dotnet restore ./Voicemeeter/Voicemeeter.csproj

      - name: Restore self-tests
        run: dotnet restore ./Voicemeeter.Tests/Voicemeeter.Tests.csproj

      - name: Build application
        run: dotnet build ./Voicemeeter/Voicemeeter.csproj -c Release --no-restore

      - name: Build self-tests
        run: dotnet build ./Voicemeeter.Tests/Voicemeeter.Tests.csproj -c Release --no-restore

      - name: Run self-tests
        run: dotnet run --project ./Voicemeeter.Tests/Voicemeeter.Tests.csproj -c Release --no-restore --no-build

      - name: Restore win-x64 publish target
        run: dotnet restore ./Voicemeeter/Voicemeeter.csproj -r win-x64

      - name: Publish Release
        run: dotnet publish ./Voicemeeter/Voicemeeter.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:PublishTrimmed=false -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false --self-contained false --no-restore

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoicemeeterMQTT-win-x64
          path: Voicemeeter/bin/Release/**/win-x64/publish/

      - name: Create Release
        if: contains(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Voicemeeter/bin/Release/**/win-x64/publish/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
